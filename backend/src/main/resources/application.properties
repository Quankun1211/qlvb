spring.application.name=mofa
server.port=${BACKEND_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/app_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.devtools.restart.enabled=true

app.jwt.secret=MofaDocumentManagementSystemJwtSecretKey2026VeryLongSecretKeyForHS512
app.jwt.access-token-expiration-ms=3600000
app.jwt.refresh-token-expiration-ms=604800000